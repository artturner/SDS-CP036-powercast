name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app_core --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 app_core --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type check with mypy (optional)
      run: |
        # Install mypy if you want type checking
        # pip install mypy
        # mypy app_core --ignore-missing-imports
        echo "Type checking skipped - add mypy to requirements-dev.txt to enable"

    - name: Test with pytest
      run: |
        pytest tests/ --cov=app_core --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Security check with bandit
      run: |
        bandit -r app_core -f json -o bandit-report.json || true
        bandit -r app_core

    - name: Check dependencies for known security vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check

  docker:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t powercast-api:${{ github.sha }} .

    - name: Test Docker image
      run: |
        # Start container in background
        docker run -d --name test-container -p 8000:8000 -e PORT=8000 powercast-api:${{ github.sha }}

        # Wait for container to start
        sleep 30

        # Test health endpoint
        curl -f http://localhost:8000/health || exit 1

        # Wait for readiness (model loading)
        for i in {1..60}; do
          if curl -f http://localhost:8000/ready; then
            echo "Service is ready"
            break
          fi
          echo "Waiting for service to be ready... ($i/60)"
          sleep 2
        done

        # Test dummy data endpoint
        curl -f http://localhost:8000/dummy-data || exit 1

        # Cleanup
        docker stop test-container
        docker rm test-container

    - name: Login to Docker Hub (only on main)
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push to Docker Hub (only on main)
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag powercast-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/powercast-api:latest
        docker tag powercast-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/powercast-api:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/powercast-api:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/powercast-api:${{ github.sha }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment"
        echo "This would trigger deployment to Railway/Render staging environment"
        # Add actual deployment commands here

  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment"
        echo "This would trigger deployment to Railway/Render production environment"
        # Add actual deployment commands here