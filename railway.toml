[build]
builder = "DOCKERFILE"
dockerfilePath = "advanced/submissions/team-members/art-turner/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
PORT = "8000"
PYTHONPATH = "/app"
EVALUATE_ON_STARTUP = "false"
DEBUG_MODE = "false"